name: CI
on:
  push:
  pull_request:
jobs:
  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++/Boost dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Hygiene
        run: python3 scripts/check_hygiene.py
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix packages/mod-sdk --no-audit --no-fund
      - run: npm run check --prefix packages/mod-sdk
