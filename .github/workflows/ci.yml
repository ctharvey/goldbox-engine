name: CI
on:
  push:
  pull_request:
jobs:
  cpp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++/Boost dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev
      - name: Build pinned SDL3 (dummy/software test backend)
        timeout-minutes: 10
        run: |
          curl --fail --location --max-time 90 https://codeload.github.com/libsdl-org/SDL/tar.gz/7f3ae3d57459e59943a4ecfefc8f6277ec6bf540 -o "$RUNNER_TEMP/sdl.tar.gz"
          tar -xzf "$RUNNER_TEMP/sdl.tar.gz" -C "$RUNNER_TEMP"
          cmake -S "$RUNNER_TEMP/SDL-7f3ae3d57459e59943a4ecfefc8f6277ec6bf540" -B "$RUNNER_TEMP/sdl-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl-install" \
            -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF -DSDL_STATIC=OFF \
            -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF \
            -DSDL_AUDIO=ON -DSDL_JOYSTICK=OFF -DSDL_HAPTIC=OFF -DSDL_CAMERA=OFF -DSDL_SENSOR=OFF
          timeout 480 cmake --build "$RUNNER_TEMP/sdl-build" --parallel 2
          cmake --install "$RUNNER_TEMP/sdl-build"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGOLDBOX_BUILD_RENDERER=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl-install"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Hygiene
        run: python3 scripts/check_hygiene.py
      - name: Third-party attribution
        run: python3 scripts/check_attribution.py
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix packages/mod-sdk --no-audit --no-fund
      - run: npm run check --prefix packages/mod-sdk
